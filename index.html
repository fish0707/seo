<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CalcMate — a fast, elegant calculator with standard and scientific modes, keyboard support, and history." />
  <title>CalcMate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" role="application" aria-label="CalcMate calculator">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">∑</span>
        <h1>CalcMate</h1>
      </div>
      <div class="modes" role="tablist" aria-label="Calculator mode">
        <button class="mode-btn is-active" data-mode="standard" role="tab" aria-selected="true">Standard</button>
        <button class="mode-btn" data-mode="scientific" role="tab" aria-selected="false">Scientific</button>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button>
    </header>

    <section class="display" aria-live="polite">
      <div id="expression" class="expression" aria-label="Current expression"></div>
      <div id="result" class="result">0</div>
    </section>

    <section class="pads">
      <div id="keys-sci" class="keys keys-sci" hidden>
        <button class="key key-fn" data-fn="sin">sin</button>
        <button class="key key-fn" data-fn="cos">cos</button>
        <button class="key key-fn" data-fn="tan">tan</button>
        <button class="key key-fn" data-fn="ln">ln</button>
        <button class="key key-fn" data-fn="log">log</button>

        <button class="key key-fn" data-insert="(">(</button>
        <button class="key key-fn" data-insert=")">)</button>
        <button class="key key-fn" data-fn="sqrt">√</button>
        <button class="key key-fn" data-op="^">x^y</button>
        <button class="key key-fn" data-fn="fact">n!</button>

        <button class="key key-fn" data-const="pi">π</button>
        <button class="key key-fn" data-const="e">e</button>
        <button class="key key-fn" data-op="%">mod</button>
        <button class="key key-fn" data-fn="inv">1/x</button>
        <button class="key key-fn" data-fn="square">x²</button>
      </div>

      <div class="keys keys-main">
        <button class="key key-util" data-action="clear">AC</button>
        <button class="key key-util" data-action="backspace" aria-label="Delete">⌫</button>
        <button class="key key-util" data-op="%">%</button>
        <button class="key key-op" data-op="/">÷</button>

        <button class="key key-num" data-num="7">7</button>
        <button class="key key-num" data-num="8">8</button>
        <button class="key key-num" data-num="9">9</button>
        <button class="key key-op" data-op="*">×</button>

        <button class="key key-num" data-num="4">4</button>
        <button class="key key-num" data-num="5">5</button>
        <button class="key key-num" data-num="6">6</button>
        <button class="key key-op" data-op="-">−</button>

        <button class="key key-num" data-num="1">1</button>
        <button class="key key-num" data-num="2">2</button>
        <button class="key key-num" data-num="3">3</button>
        <button class="key key-op" data-op="+">+</button>

        <button class="key key-num key-zero" data-num="0">0</button>
        <button class="key key-num" data-num=".">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </div>
    </section>

    <aside class="history" aria-label="Calculation history">
      <div class="history-head">
        <h2>History</h2>
        <button id="clear-history" class="link-btn">Clear</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="history-empty">No calculations yet.</p>
    </aside>
  </main>

  <script src="calc.js"></script>
</body>
</html>
